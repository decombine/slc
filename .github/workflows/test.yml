name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Run on Fedora
    runs-on: [self-hosted, linux, x64, rapid]
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          go test ./... -v