name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Run on ARC
    runs-on: decombine-arc-public
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Running Tests
        run: |
          go mod tidy
          go test ./... -v
