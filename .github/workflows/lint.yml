name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Run on ARC
    runs-on: decombine-arc-public
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Run linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
